# Optional: a real Postgres 17 for local dev. Then set
# DATABASE_URL=postgres://gymfuel:gymfuel@localhost:5432/gymfuel in .env.local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gymfuel
      POSTGRES_PASSWORD: gymfuel
      POSTGRES_DB: gymfuel
    ports:
      - "5432:5432"
    volumes:
      - gymfuel-pg:/var/lib/postgresql/data
volumes:
  gymfuel-pg:
